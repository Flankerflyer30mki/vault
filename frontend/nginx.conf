# Compose/local image: serve the SPA and forward /api to Django on the same origin (mirrors the Vercel rewrite).
server {
    listen 5173;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;              # keeps the port, so Django's CSRF Origin check matches
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
