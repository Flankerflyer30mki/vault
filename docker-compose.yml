# Local development only. Credentials here are throwaway dev values.
x-env: &env
  DEBUG: "1"
  SECRET_KEY: dev-only-not-secret
  DATABASE_URL: postgres://postgres:vaultpass@db:5432/vault
  DB_SSLMODE: disable
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  ALLOW_CUSTOM_CODE: "1"  # local only: the subprocess runner is NOT a security boundary

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vaultpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      <<: *env
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "manage.py", "run_worker"]
    environment: *env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
